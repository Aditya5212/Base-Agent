[project]
name = "base-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "lightrag-hku[api]>=1.5.7",
    "markitdown>=0.1.9",
    "pgvector<0.4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "taskiq==0.12.6",
    "taskiq-pg>=0.2.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
